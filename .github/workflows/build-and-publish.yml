name: Build and publish NGINX VTS packages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Rebuild from each OS's current security and updates repositories.
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vts-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.distro.codename }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro:
          - { codename: bookworm, image: 'debian:12' }
          - { codename: trixie, image: 'debian:13' }
          - { codename: noble, image: 'ubuntu:24.04' }
          - { codename: resolute, image: 'ubuntu:26.04' }
    steps:
      - uses: actions/checkout@v4
      - name: Build against the distro-provided NGINX
        run: |
          docker run --rm --platform 'linux/${{ matrix.arch }}' \
            -v "$PWD:/workspace" -w /workspace \
            '${{ matrix.distro.image }}' \
            bash scripts/build.sh '${{ matrix.distro.codename }}'
      - name: Store verified DEB
        uses: actions/upload-artifact@v4
        with:
          name: vts-${{ matrix.distro.codename }}-${{ matrix.arch }}
          path: out/${{ matrix.distro.codename }}/${{ matrix.arch }}/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign and update APT repository
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: vts-*
          path: packages
          merge-multiple: true
      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg
      - name: Sign repository and update persistent package indexes
        env:
          APT_GPG_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY_B64 }}
          APT_SIGNING_FINGERPRINT: ${{ secrets.APT_SIGNING_FINGERPRINT }}
          APT_SITE_DIR: ${{ github.workspace }}/.apt-site
        run: bash scripts/publish.sh packages
      - name: Prepare public GitHub Pages content
        run: |
          mkdir -p .apt-pages-public
          cp -a .apt-site/dists .apt-site/pool \
            .apt-site/public-key.gpg .apt-site/public-key.asc \
            .apt-site/index.html .apt-pages-public/
          touch .apt-pages-public/.nojekyll
      - name: Upload signed APT repository as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .apt-pages-public

  deploy:
    name: Deploy public APT repository to GitHub Pages
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
